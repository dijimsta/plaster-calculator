mutation CreateMyCompany(
    $id: UUID!
    $companyName: String!
    $businessNumber: String
    $phoneNumber: String
) @auth(level: USER) {
    company_insert(
        data: {
            id: $id
            teamId_expr: "auth.token.teamId"
            companyName: $companyName
            businessNumber: $businessNumber
            phoneNumber: $phoneNumber
            createdAt_expr: "request.time"
            updatedAt_expr: "request.time"
        }
    )
}

mutation UpdateMyCompany(
    $id: UUID!
    $companyName: String!
    $businessNumber: String
    $phoneNumber: String
) @auth(level: USER) @transaction {
    query @redact {
        company(key: { id: $id })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this company"
            ) {
            id
            teamId
        }
    }
    company_update(
        id: $id
        data: {
            companyName: $companyName
            businessNumber: $businessNumber
            phoneNumber: $phoneNumber
            updatedAt_expr: "request.time"
        }
    )
}

mutation SetMyCompanyPrimaryContact($companyId: UUID!, $contactId: UUID!)
@auth(level: USER)
@transaction {
    query @redact {
        company(key: { id: $companyId })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this company"
            ) {
            id
            teamId
        }
        companyContact(
            first: {
                where: { id: { eq: $contactId }, companyId: { eq: $companyId } }
            }
        ) @check(expr: "this != null", message: "Contact not found") {
            id
        }
    }
    company_update(
        id: $companyId
        data: { primaryContactId: $contactId, updatedAt_expr: "request.time" }
    )
}

mutation ClearMyCompanyPrimaryContact($companyId: UUID!)
@auth(level: USER)
@transaction {
    query @redact {
        company(key: { id: $companyId })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this company"
            ) {
            id
            teamId
        }
    }
    company_update(
        id: $companyId
        data: { primaryContactId: null, updatedAt_expr: "request.time" }
    )
}

mutation DeleteMyCompany($id: UUID!) @auth(level: USER) @transaction {
    query @redact {
        company(key: { id: $id })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this company"
            ) {
            id
            teamId
        }
    }
    companyContact_deleteMany(where: { companyId: { eq: $id } })
    company_delete(id: $id)
        @check(expr: "this != null", message: "Company not found")
}

mutation CreateMyCompanyContact(
    $id: UUID!
    $companyId: UUID!
    $name: String!
    $email: String
    $phoneNumber: String
    $role: String
) @auth(level: USER) @transaction {
    query @redact {
        company(key: { id: $companyId })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this company"
            ) {
            id
            teamId
        }
    }
    companyContact_insert(
        data: {
            id: $id
            companyId: $companyId
            name: $name
            email: $email
            phoneNumber: $phoneNumber
            role: $role
            createdAt_expr: "request.time"
            updatedAt_expr: "request.time"
        }
    )
}

mutation UpdateMyCompanyContact(
    $companyId: UUID!
    $contactId: UUID!
    $name: String!
    $email: String
    $phoneNumber: String
    $role: String
) @auth(level: USER) @transaction {
    query @redact {
        company(key: { id: $companyId })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this company"
            ) {
            id
            teamId
        }
    }
    companyContact_update(
        first: {
            where: { id: { eq: $contactId }, companyId: { eq: $companyId } }
        }
        data: {
            name: $name
            email: $email
            phoneNumber: $phoneNumber
            role: $role
            updatedAt_expr: "request.time"
        }
    ) @check(expr: "this != null", message: "Contact not found")
}

mutation DeleteMyCompanyContact($companyId: UUID!, $contactId: UUID!)
@auth(level: USER)
@transaction {
    query @redact {
        company(key: { id: $companyId })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this company"
            ) {
            id
            teamId
        }
    }
    company_update(
        first: {
            where: {
                id: { eq: $companyId }
                primaryContactId: { eq: $contactId }
            }
        }
        data: { primaryContactId: null, updatedAt_expr: "request.time" }
    )
    companyContact_delete(
        first: {
            where: { id: { eq: $contactId }, companyId: { eq: $companyId } }
        }
    ) @check(expr: "this != null", message: "Contact not found")
}
