query ListQuoteItemTemplates @auth(level: USER) {
    quoteItemTemplates(
        where: {
            _or: [
                { scope: { eq: "SYSTEM" } }
                { teamId: { eq_expr: "auth.token.teamId" } }
            ]
        }
        orderBy: [{ sortOrder: ASC }]
    ) {
        id
        teamId
        scope
        systemKey
        name
        unit
        hasKeywords
        keywords
        quantitySourceId
        sortOrder
        createdAt
        updatedAt
    }
}

query ListQuoteTemplatesForTeam @auth(level: USER) {
    quoteTemplates(
        where: { teamId: { eq_expr: "auth.token.teamId" } }
        orderBy: [{ isDefault: DESC }, { updatedAt: DESC }]
    ) {
        id
        name
        isDefault
        createdAt
        updatedAt
    }
}

query ListQuoteItemTemplateConfigsForQuoteTemplate($quoteTemplateId: UUID!)
@auth(level: USER) {
    quoteTemplate(key: { id: $quoteTemplateId })
        @redact
        @check(
            expr: "this != null && this.teamId == auth.token.teamId"
            message: "You do not have access to this quote template"
        ) {
        id
        teamId
    }
    quoteItemTemplateConfigs(
        where: { quoteTemplateId: { eq: $quoteTemplateId } }
        orderBy: [{ createdAt: ASC }]
    ) {
        quoteTemplateId
        itemTemplateId
        enabled
        unitPriceCents
        materialUnitPriceCents
        labourUnitPriceCents
        createdAt
        updatedAt
        itemTemplate {
            id
            name
            unit
            hasKeywords
            keywords
            sortOrder
        }
    }
}

# Feeds the quotes list view. One row per quote, newest-first via the
# `(teamId, createdAt)` index added in WORK-111. `total inc. GST` isn't a
# stored column on `Quote` — only `QuoteItem` rows carry line data — so this
# selects each quote's `QuoteItem` `quantity`/`unitPriceCents` pairs via the
# `quoteItems_on_quote` reverse relation (the same nesting pattern
# `ListProjectQuestionnaires` uses for `projectQuestionnaireQuestions_on_projectQuestionnaire`
# below); the caller runs them through `QuoteTotalsUtils.lineAmountCents` /
# `subtotalCents` / `gstCents` / `totalIncGstCents` (WORK-110) to compute the
# total client-side rather than duplicating that maths in the query layer.
query ListQuotesForTeam @auth(level: USER) {
    quotes(
        where: { teamId: { eq_expr: "auth.token.teamId" } }
        orderBy: [{ createdAt: DESC }]
    ) {
        id
        reference
        status
        createdAt
        project {
            id
            name
            company {
                id
                companyName
            }
        }
        items: quoteItems_on_quote {
            quantity
            unitPriceCents
        }
    }
}

# Feeds the quote detail document: the quote itself, its `QuoteItem` line
# rows, and each line's `QuantitySource` provenance (how its quantity was
# derived). `quote` is guarded by the same `@check` ownership pattern
# `ListQuoteItemTemplateConfigsForQuoteTemplate` uses for `quoteTemplate`
# above, and — like `GetQuoteReadiness`'s `project` — is not `@redact`ed
# because the caller needs its fields back, not just its validated
# existence.
query GetQuoteById($id: UUID!) @auth(level: USER) {
    quote(key: { id: $id })
        @check(
            expr: "this != null && this.teamId == auth.token.teamId"
            message: "You do not have access to this quote"
        ) {
        id
        teamId
        projectId
        supplierId
        status
        reference
        issuedAt
        sentAt
        acceptedAt
        createdAt
        updatedAt
        project {
            id
            name
            company {
                id
                companyName
            }
        }
        items: quoteItems_on_quote(orderBy: [{ displayOrder: ASC }]) {
            id
            displayOrder
            name
            quantity
            unit
            unitPriceCents
            materialUnitPriceCents
            labourUnitPriceCents
            matchedKeywords
            sourceTemplateId
            quantitySourceId
            quantitySource {
                id
                measurementSource
                measurementPlasterType
            }
            createdAt
            updatedAt
        }
    }
}

# Feeds the quote readiness gate (WORK-124) in a single round trip: the
# project header, its floorplan pages, its questionnaire answers, and one
# quote template's enabled pricing configs. `project` uses the same `@check`
# guard expression against `auth.token.teamId` as
# `ListQuoteItemTemplateConfigsForQuoteTemplate` guards `quoteTemplate`, so a
# project from another team can't be read; the whole request fails before
# any data is returned if the check fails. Unlike that query's
# `quoteTemplate`, `project` is not `@redact`ed, because the caller needs its
# fields (not just its validated existence) back in the response.
# `floorplanPages` and `projectQuestionnaireQuestions` are filtered by
# `$projectId`, which is only reachable once the `project` check has passed.
# `project` also selects `company { id quoteTemplateId }` so the caller can
# resolve which template a project's company is assigned to (or confirm it
# should fall back to the default) in this same round trip, rather than a
# separate query just to read that one field.
#
# `quoteItemTemplateConfigs` (WORK-191) is now scoped to exactly one
# `$quoteTemplateId` rather than every config belonging to the team: a team
# with more than one `QuoteTemplate` would otherwise get every template's
# configs merged together, mixing prices from unrelated variations into one
# readiness/pricing response. Ownership of `$quoteTemplateId` is validated
# the same way `ListQuoteItemTemplateConfigsForQuoteTemplate` validates it —
# a `@redact`ed `quoteTemplate` lookup `@check`ed against
# `auth.token.teamId` — so a template from another team can't be used to
# leak that team's pricing.
query GetQuoteReadiness($projectId: UUID!, $quoteTemplateId: UUID!)
@auth(level: USER) {
    project(key: { id: $projectId })
        @check(
            expr: "this != null && this.teamId == auth.token.teamId"
            message: "You do not have access to this project"
        ) {
        id
        teamId
        name
        salesStatus
        pageCount
        extractedTextJson
        company {
            id
            quoteTemplateId
        }
    }
    floorplanPages(
        where: { projectId: { eq: $projectId } }
        orderBy: [{ pageNumber: ASC }]
    ) {
        id
        pageNumber
        scaleMmPerPx
        ceilingHeightMm
        overlayJson
        ocrTextContent
    }
    projectQuestionnaireQuestions(
        where: { projectQuestionnaire: { projectId: { eq: $projectId } } }
        orderBy: [{ position: ASC }]
    ) {
        id
        label
        answer
        answerSource
    }
    quoteTemplate(key: { id: $quoteTemplateId })
        @redact
        @check(
            expr: "this != null && this.teamId == auth.token.teamId"
            message: "You do not have access to this quote template"
        ) {
        id
        teamId
    }
    quoteItemTemplateConfigs(
        where: {
            enabled: { eq: true }
            quoteTemplateId: { eq: $quoteTemplateId }
        }
        orderBy: [{ createdAt: ASC }]
    ) {
        itemTemplateId
        enabled
        unitPriceCents
        itemTemplate {
            id
            name
            unit
            hasKeywords
            keywords
            sortOrder
            quantitySourceId
            quantitySource {
                id
                measurementSource
                measurementPlasterType
            }
        }
    }
}

# Feeds the project's Quote tab: reads back the `Quote` `CreateQuoteWithItems`
# (WORK-145) just generated for a project, so the tab can render it after
# generation and on later visits, plus each `QuoteItem`'s `quantitySource`
# (why a quantity is what it is) and `sourceTemplate` (which catalog entry
# produced the line) nested inline — the same two `@ref`s `GetQuoteById`
# selects for `quantitySource`, extended here with `sourceTemplate` so the
# Quote tab doesn't need a second round trip per line to show provenance.
#
# `project` is guarded by the same `@check` ownership pattern `GetQuoteById`
# and `GetQuoteReadiness` use, so a project from another team can't be read.
# `Quote.project` is `@unique` (at most one quote per project — the
# constraint `CreateQuoteWithItems`'s regenerate-on-draft logic relies on),
# so the reverse relation Data Connect generates for it is a singular
# `quote_on_project` object, not a list: unlike `GetQuoteById`, which
# `@check`s `this != null` on the `quote` field itself and therefore throws
# when the id doesn't resolve, nesting `quote_on_project` under the
# already-`@check`ed `project` is a plain field lookup with no `@check` of
# its own, so it resolves to `null` when the project has no quote yet
# (nothing generated, or a project that predates WORK-145) rather than
# erroring — exactly the "no quote yet" case this query needs to support,
# since the Quote tab must render a "not generated" state, not an error.
query GetProjectQuote($projectId: UUID!) @auth(level: USER) {
    project(key: { id: $projectId })
        @check(
            expr: "this != null && this.teamId == auth.token.teamId"
            message: "You do not have access to this project"
        ) {
        id
        teamId
        quote: quote_on_project {
            id
            teamId
            projectId
            supplierId
            status
            reference
            issuedAt
            sentAt
            acceptedAt
            createdAt
            updatedAt
            items: quoteItems_on_quote(orderBy: [{ displayOrder: ASC }]) {
                id
                displayOrder
                name
                quantity
                unit
                unitPriceCents
                materialUnitPriceCents
                labourUnitPriceCents
                matchedKeywords
                sourceTemplateId
                quantitySourceId
                sourceTemplate {
                    id
                    name
                    scope
                    systemKey
                }
                quantitySource {
                    id
                    measurementSource
                    measurementPlasterType
                }
                createdAt
                updatedAt
            }
        }
    }
}
