query ListQuoteItemTemplates @auth(level: USER) {
    quoteItemTemplates(
        where: {
            _or: [
                { scope: { eq: "SYSTEM" } }
                { teamId: { eq_expr: "auth.token.teamId" } }
            ]
        }
        orderBy: [{ sortOrder: ASC }]
    ) {
        id
        teamId
        scope
        systemKey
        name
        hasKeywords
        keywords
        quantitySourceId
        sortOrder
        createdAt
        updatedAt
    }
}

query ListQuoteTemplatesForTeam @auth(level: USER) {
    quoteTemplates(
        where: { teamId: { eq_expr: "auth.token.teamId" } }
        orderBy: [{ updatedAt: DESC }]
    ) {
        id
        name
        createdAt
        updatedAt
    }
}

query ListQuoteItemTemplateConfigsForQuoteTemplate($quoteTemplateId: UUID!)
@auth(level: USER) {
    quoteTemplate(key: { id: $quoteTemplateId })
        @redact
        @check(
            expr: "this != null && this.teamId == auth.token.teamId"
            message: "You do not have access to this quote template"
        ) {
        id
        teamId
    }
    quoteItemTemplateConfigs(
        where: { quoteTemplateId: { eq: $quoteTemplateId } }
        orderBy: [{ createdAt: ASC }]
    ) {
        quoteTemplateId
        itemTemplateId
        enabled
        unitPriceCents
        materialUnitPriceCents
        labourUnitPriceCents
        createdAt
        updatedAt
        itemTemplate {
            id
            name
            hasKeywords
            keywords
            sortOrder
        }
    }
}

# Feeds the quote readiness gate (WORK-124) in a single round trip: the
# project header, its floorplan pages, its questionnaire answers, and the
# team's enabled pricing configs. `project` uses the same `@check` guard
# expression against `auth.token.teamId` as `ListQuoteItemTemplateConfigsForQuoteTemplate`
# guards `quoteTemplate` above, so a project from another team can't be read;
# the whole request fails before any data is returned if the check fails.
# Unlike that query's `quoteTemplate`, `project` is not `@redact`ed, because
# the caller needs its fields (not just its validated existence) back in the
# response. `floorplanPages` and `projectQuestionnaireQuestions` are filtered
# by `$projectId`, which is only reachable once the `project` check has
# passed. `quoteItemTemplateConfigs` has no relationship to a project, so
# it's scoped directly by team using the same `auth.token.teamId` guard,
# matching `ListQuoteItemTemplates` and `ListProjectQuestionnaires`.
# Feeds the quotes list view. One row per quote, newest-first via the
# `(teamId, createdAt)` index added in WORK-111. `total inc. GST` isn't a
# stored column on `Quote` — only `QuoteItem` rows carry line data — so this
# selects each quote's `QuoteItem` `quantity`/`unitPriceCents` pairs via the
# `quoteItems_on_quote` reverse relation (the same nesting pattern
# `ListProjectQuestionnaires` uses for `projectQuestionnaireQuestions_on_projectQuestionnaire`
# below); the caller runs them through `QuoteTotalsUtils.lineAmountCents` /
# `subtotalCents` / `gstCents` / `totalIncGstCents` (WORK-110) to compute the
# total client-side rather than duplicating that maths in the query layer.
query ListQuotesForTeam @auth(level: USER) {
    quotes(
        where: { teamId: { eq_expr: "auth.token.teamId" } }
        orderBy: [{ createdAt: DESC }]
    ) {
        id
        reference
        status
        createdAt
        project {
            id
            name
            company {
                id
                companyName
            }
        }
        items: quoteItems_on_quote {
            quantity
            unitPriceCents
        }
    }
}

# Feeds the quote detail document: the quote itself, its `QuoteItem` line
# rows, and each line's `QuantitySource` provenance (how its quantity was
# derived). `quote` is guarded by the same `@check` ownership pattern
# `ListQuoteItemTemplateConfigsForQuoteTemplate` uses for `quoteTemplate`
# above, and — like `GetQuoteReadiness`'s `project` — is not `@redact`ed
# because the caller needs its fields back, not just its validated
# existence.
query GetQuoteById($id: UUID!) @auth(level: USER) {
    quote(key: { id: $id })
        @check(
            expr: "this != null && this.teamId == auth.token.teamId"
            message: "You do not have access to this quote"
        ) {
        id
        teamId
        projectId
        supplierId
        status
        reference
        issuedAt
        sentAt
        acceptedAt
        createdAt
        updatedAt
        project {
            id
            name
            company {
                id
                companyName
            }
        }
        items: quoteItems_on_quote(orderBy: [{ displayOrder: ASC }]) {
            id
            displayOrder
            name
            quantity
            unitPriceCents
            materialUnitPriceCents
            labourUnitPriceCents
            matchedKeywords
            sourceTemplateId
            quantitySourceId
            quantitySource {
                id
                measurementSource
                measurementPlasterType
            }
            createdAt
            updatedAt
        }
    }
}

query GetQuoteReadiness($projectId: UUID!) @auth(level: USER) {
    project(key: { id: $projectId })
        @check(
            expr: "this != null && this.teamId == auth.token.teamId"
            message: "You do not have access to this project"
        ) {
        id
        teamId
        name
        salesStatus
        pageCount
    }
    floorplanPages(
        where: { projectId: { eq: $projectId } }
        orderBy: [{ pageNumber: ASC }]
    ) {
        id
        pageNumber
        scaleMmPerPx
        ceilingHeightMm
        overlayJson
    }
    projectQuestionnaireQuestions(
        where: { projectQuestionnaire: { projectId: { eq: $projectId } } }
        orderBy: [{ position: ASC }]
    ) {
        id
        label
        answer
        answerSource
    }
    quoteItemTemplateConfigs(
        where: {
            enabled: { eq: true }
            quoteTemplate: { teamId: { eq_expr: "auth.token.teamId" } }
        }
        orderBy: [{ createdAt: ASC }]
    ) {
        itemTemplateId
        enabled
        unitPriceCents
        itemTemplate {
            id
            name
            hasKeywords
            keywords
            sortOrder
            quantitySourceId
        }
    }
}
