# Creates a `Quote` plus up to 20 `QuoteItem` rows in a single
# `@transaction` mutation — the same "one document, many writes, atomically"
# shape as `EnsureSystemQuoteItemTemplates` above.
#
# Regenerate policy: `Quote.project` is `@unique`, so at most one `Quote`
# exists per project. If a project already has a `draft` quote, this call
# replaces it (deletes the old `Quote` and its `QuoteItem` rows, then
# inserts the new ones). If the existing quote is `sent` or `accepted`,
# this call must fail rather than silently clobbering a finalized quote.
#
# `quoteItem_deleteMany`/`quote_deleteMany` below are filtered by
# `status: { eq: "draft" }`, so they no-op when the existing quote is
# `sent`/`accepted` (or there is no existing quote at all). The
# `quote_insert` that follows then collides with `Quote`'s `@unique`
# `project` constraint if a non-draft row is still present, and the whole
# `@transaction` rolls back — so "reject if sent/accepted" falls out of
# the existing unique constraint rather than needing a custom `@check`
# here. This is the mechanism WORK-145 proposed, and it works as
# suggested: the nested relation filter
# (`quoteItem_deleteMany(where: { quote: { ... } })`) compiles and
# generates a working SDK.
#
# What did NOT work, and is why this mutation's shape looks the way it
# does: a single list-input variable for the items (e.g.
# `$items: [QuoteItem_Data!]!` passed straight to a hypothetical
# `quoteItem_insertMany(data: $items)`). Both the list form and the
# singular form (`$item: QuoteItem_Data!` into
# `quoteItem_insert(data: $item)`) are rejected outright by
# `firebase dataconnect:sdk:generate`:
# `_Data input types are not yet supported by the generated SDKs:
# "QuoteItem_Data"`. That is a hard stop in the currently-pinned
# `firebase-tools` — no document can declare a variable of an
# auto-generated `<Table>_Data` type, list or not, and still get a
# working JS SDK out of it.
#
# GraphQL mutation documents are also static — there is no directive
# that expands a field selection to match a variable-length runtime
# array — so the only way left to accept a variable number of items in
# one atomic document is a fixed number of aliased `quoteItem_insert`
# slots, each individually switched on with the standard `@include`
# directive (proven separately to compile and generate correctly). Every
# per-slot variable above has a default, so a caller only has to supply
# values (and `$includeItemN: true`) for the slots it actually uses;
# unused slots need no arguments at all.
#
# 20 slots is a deliberately generous cap: `EnsureSystemQuoteItemTemplates`
# seeds 6 system item templates, and a team's own `QuoteItemTemplate`
# rows (via `CreateQuoteItemTemplate`) add to that — 20 comfortably
# covers system + team templates for any realistic team catalog. If a
# project's generated item set ever needs to exceed 20, that is an
# application-layer concern (validate before calling, or extend this
# mutation with more slots) — not something a `@check` here could
# enforce, matching how `UpdateQuoteStatus` above defers
# transition-order enforcement to the web app layer rather than guessing
# at it here.
mutation CreateQuoteWithItems(
    $projectId: UUID!
    $quoteId: UUID!
    $includeItem1: Boolean = false
    $item1Name: String = ""
    $item1DisplayOrder: Int = 0
    $item1Quantity: Float = 0
