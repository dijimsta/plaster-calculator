mutation CreateQuoteTemplate($id: UUID!, $name: String!) @auth(level: USER) {
    quoteTemplate_insert(
        data: {
            id: $id
            teamId_expr: "auth.token.teamId"
            name: $name
            createdAt_expr: "request.time"
            updatedAt_expr: "request.time"
        }
    )
}

mutation CreateQuoteItemTemplateConfig(
    $quoteTemplateId: UUID!
    $itemTemplateId: UUID!
    $unitPriceCents: Int!
    $materialUnitPriceCents: Int!
    $labourUnitPriceCents: Int!
) @auth(level: USER) @transaction {
    query @redact {
        quoteTemplate(key: { id: $quoteTemplateId })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this quote template"
            ) {
            id
            teamId
        }
    }
    quoteItemTemplateConfig_insert(
        data: {
            quoteTemplateId: $quoteTemplateId
            itemTemplateId: $itemTemplateId
            unitPriceCents: $unitPriceCents
            materialUnitPriceCents: $materialUnitPriceCents
            labourUnitPriceCents: $labourUnitPriceCents
            createdAt_expr: "request.time"
            updatedAt_expr: "request.time"
        }
    )
}

mutation UpdateQuoteItemTemplateConfig(
    $quoteTemplateId: UUID!
    $itemTemplateId: UUID!
    $enabled: Boolean!
    $unitPriceCents: Int!
    $materialUnitPriceCents: Int!
    $labourUnitPriceCents: Int!
) @auth(level: USER) @transaction {
    query @redact {
        quoteTemplate(key: { id: $quoteTemplateId })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this quote template"
            ) {
            id
            teamId
        }
    }
    quoteItemTemplateConfig_update(
        key: {
            quoteTemplateId: $quoteTemplateId
            itemTemplateId: $itemTemplateId
        }
        data: {
            enabled: $enabled
            unitPriceCents: $unitPriceCents
            materialUnitPriceCents: $materialUnitPriceCents
            labourUnitPriceCents: $labourUnitPriceCents
            updatedAt_expr: "request.time"
        }
    )
}

mutation CreateQuoteItemTemplate(
    $id: UUID!
    $name: String!
    $unit: String!
    $hasKeywords: Boolean!
    $keywords: [String!]!
) @auth(level: USER) {
    quoteItemTemplate_insert(
        data: {
            id: $id
            teamId_expr: "auth.token.teamId"
            scope: "TEAM"
            name: $name
            unit: $unit
            hasKeywords: $hasKeywords
            keywords: $keywords
            createdAt_expr: "request.time"
            updatedAt_expr: "request.time"
        }
    )
}

mutation UpdateQuoteItemTemplate(
    $id: UUID!
    $name: String!
    $unit: String!
    $hasKeywords: Boolean!
    $keywords: [String!]!
) @auth(level: USER) @transaction {
    query @redact {
        quoteItemTemplate(key: { id: $id })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this item"
            ) {
            id
            teamId
        }
    }
    quoteItemTemplate_update(
        id: $id
        data: {
            name: $name
            unit: $unit
            hasKeywords: $hasKeywords
            keywords: $keywords
            updatedAt_expr: "request.time"
        }
    )
}

mutation DeleteQuoteItemTemplate($id: UUID!) @auth(level: USER) @transaction {
    query @redact {
        quoteItemTemplate(key: { id: $id })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this item"
            ) {
            id
            teamId
        }
    }
    quoteItemTemplateConfig_deleteMany(where: { itemTemplateId: { eq: $id } })
    quoteItemTemplate_delete(id: $id)
        @check(expr: "this != null", message: "Item not found")
}

# Sets `status`, stamping `updatedAt` the same way every other mutation in
# this file does.
#
# This does not also conditionally stamp `sentAt`/`acceptedAt` in the same
# call. That was tried — `sentAt_expr`/`acceptedAt_expr` set to
# `"vars.status == 'sent' ? request.time : this"` (reading `$status` via
# `vars.status`, the same way `AcceptTeamInvitation` in
# connector-admin/teams.mutations.gql reads a mutation variable inside a
# `@check` expr via `vars.tokenHash`) — on the theory that Data Connect
# supports an increment-style self-reference in `_expr` fields (as in
# `count_expr: "this + 1"`). `firebase dataconnect:sdk:generate` rejects it:
# `this` is not declared in the CEL environment for an `_update` mutation's
# `Timestamp_Expr` fields, only in `@check` contexts. Without a working
# self-reference there is no schema-valid way for a single static mutation
# document to conditionally write exactly one of two fields while leaving
# the other untouched: the `data` field set is fixed at author time, so a
# `sent`-transition call and an `accepted`-transition call both evaluate
# every expression in this document, and any non-matching branch has to
# produce *some* Timestamp value — `null` would silently erase a
# previously-set `sentAt` the next time this mutation runs for the
# `accepted` transition.
#
# The schema-valid way to stamp a single field unconditionally with
# `request.time` is a dedicated mutation per transition — exactly what
# `AcceptTeamInvitation` already does for `acceptedAt`. That's deliberately
# not added here: this ticket's scope is the status write, and per-status
# timestamp stamping can follow later (e.g. alongside WORK-123, when the web
# app layer's actual needs are known) as `MarkQuoteSent`/`MarkQuoteAccepted`
# mutations shaped like `AcceptTeamInvitation` rather than guessed at now.
#
# Similarly, this mutation does not enforce that draft -> sent -> accepted
# is followed in order — a `@check` here could only compare against the
# quote's *current* status, not walk a full state machine. Transition-order
# enforcement belongs to the web app layer (WORK-123).
mutation UpdateQuoteStatus($id: UUID!, $status: String!)
@auth(level: USER)
@transaction {
    query @redact {
        quote(key: { id: $id })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this quote"
            ) {
            id
            teamId
        }
    }
    quote_update(
        id: $id
        data: { status: $status, updatedAt_expr: "request.time" }
    )
}

# Generated quotes are snapshots of their template/take-off inputs. These
# focused mutations let users edit that snapshot without changing the source
# template or regenerating the quote. Every operation validates team ownership
# before writing; item creation derives teamId from the authenticated token.
mutation UpdateQuoteDetails($id: UUID!, $reference: String)
@auth(level: USER)
@transaction {
    query @redact {
        quote(key: { id: $id })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this quote"
            ) {
            id
            teamId
        }
    }
    quote_update(
        id: $id
        data: { reference: $reference, updatedAt_expr: "request.time" }
    )
}

mutation UpdateQuoteItem(
    $id: UUID!
    $displayOrder: Int!
    $name: String!
    $quantity: Float!
    $unit: String
    $unitPriceCents: Int!
) @auth(level: USER) @transaction {
    query @redact {
        quoteItem(key: { id: $id })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this quote item"
            ) {
            id
            teamId
        }
    }
    quoteItem_update(
        id: $id
        data: {
            sourceTemplateId: null
            displayOrder: $displayOrder
            name: $name
            quantity: $quantity
            unit: $unit
            quantitySourceId: null
            unitPriceCents: $unitPriceCents
            materialUnitPriceCents: 0
            labourUnitPriceCents: 0
            matchedKeywords: []
            updatedAt_expr: "request.time"
        }
    )
}

mutation CreateQuoteItem(
    $id: UUID!
    $quoteId: UUID!
    $displayOrder: Int!
    $name: String!
    $quantity: Float!
    $unit: String!
    $unitPriceCents: Int!
) @auth(level: USER) @transaction {
    query @redact {
        quote(key: { id: $quoteId })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this quote"
            ) {
            id
            teamId
        }
    }
    quoteItem_insert(
        data: {
            id: $id
            teamId_expr: "auth.token.teamId"
            quoteId: $quoteId
            sourceTemplateId: null
            displayOrder: $displayOrder
            name: $name
            quantity: $quantity
            unit: $unit
            quantitySourceId: null
            unitPriceCents: $unitPriceCents
            materialUnitPriceCents: 0
            labourUnitPriceCents: 0
            matchedKeywords: []
            createdAt_expr: "request.time"
            updatedAt_expr: "request.time"
        }
    )
}

mutation DeleteQuoteItem($id: UUID!) @auth(level: USER) @transaction {
    query @redact {
        quoteItem(key: { id: $id })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this quote item"
            ) {
            id
            teamId
        }
    }
    quoteItem_delete(id: $id)
        @check(expr: "this != null", message: "Quote item not found")
}

# Creates a `Quote` plus up to 20 `QuoteItem` rows in a single
# `@transaction` mutation — the same "one document, many writes, atomically"
# shape as `ReconcileSystemQuoteItemTemplates` above.
#
# Regenerate policy: `Quote.project` is `@unique`, so at most one `Quote`
# exists per project. If a project already has a `draft` quote, this call
# replaces it (deletes the old `Quote` and its `QuoteItem` rows, then
# inserts the new ones). If the existing quote is `sent` or `accepted`,
# this call must fail rather than silently clobbering a finalized quote.
#
# `quoteItem_deleteMany`/`quote_deleteMany` below are filtered by
# `status: { eq: "draft" }`, so they no-op when the existing quote is
# `sent`/`accepted` (or there is no existing quote at all). The
# `quote_insert` that follows then collides with `Quote`'s `@unique`
# `project` constraint if a non-draft row is still present, and the whole
# `@transaction` rolls back — so "reject if sent/accepted" falls out of
# the existing unique constraint rather than needing a custom `@check`
# here. This is the mechanism WORK-145 proposed, and it works as
# suggested: the nested relation filter
# (`quoteItem_deleteMany(where: { quote: { ... } })`) compiles and
# generates a working SDK.
#
# What did NOT work, and is why this mutation's shape looks the way it
# does: a single list-input variable for the items (e.g.
# `$items: [QuoteItem_Data!]!` passed straight to a hypothetical
# `quoteItem_insertMany(data: $items)`). Both the list form and the
# singular form (`$item: QuoteItem_Data!` into
# `quoteItem_insert(data: $item)`) are rejected outright by
# `firebase dataconnect:sdk:generate`:
# `_Data input types are not yet supported by the generated SDKs:
# "QuoteItem_Data"`. That is a hard stop in the currently-pinned
# `firebase-tools` — no document can declare a variable of an
# auto-generated `<Table>_Data` type, list or not, and still get a
# working JS SDK out of it.
#
# GraphQL mutation documents are also static — there is no directive
# that expands a field selection to match a variable-length runtime
# array — so the only way left to accept a variable number of items in
# one atomic document is a fixed number of aliased `quoteItem_insert`
# slots, each individually switched on with the standard `@include`
# directive (proven separately to compile and generate correctly). Every
# per-slot variable above has a default, so a caller only has to supply
# values (and `$includeItemN: true`) for the slots it actually uses;
# unused slots need no arguments at all.
#
# 20 slots covers the 13 system plasterboard templates plus a team's own
# `QuoteItemTemplate` rows (via `CreateQuoteItemTemplate`). It comfortably
# covers system + team templates for any realistic team catalog. If a
# project's generated item set ever needs to exceed 20, that is an
# application-layer concern (validate before calling, or extend this
# mutation with more slots) — not something a `@check` here could
# enforce, matching how `UpdateQuoteStatus` above defers
# transition-order enforcement to the web app layer rather than guessing
# at it here.
