query ListMyCompanies($search: String, $limit: Int, $offset: Int)
@auth(level: USER) {
    companies(
        where: {
            teamId: { eq_expr: "auth.token.teamId" }
            companyName: { contains: $search }
        }
        orderBy: [{ updatedAt: DESC }]
        limit: $limit
        offset: $offset
    ) {
        id
        teamId
        companyName
        businessNumber
        phoneNumber
        primaryContactId
        quoteTemplateId
        quoteTemplate {
            id
            name
        }
        createdAt
        updatedAt
    }
}

query GetMyCompany($id: UUID!) @auth(level: USER) {
    company(key: { id: $id })
        @check(
            expr: "this != null && this.teamId == auth.token.teamId"
            message: "You do not have access to this company"
        ) {
        id
        teamId
        companyName
        businessNumber
        phoneNumber
        primaryContactId
        quoteTemplateId
        quoteTemplate {
            id
            name
        }
        createdAt
        updatedAt
        contacts: companyContacts_on_company(orderBy: [{ createdAt: ASC }]) {
            id
            companyId
            name
            email
            phoneNumber
            role
            createdAt
            updatedAt
        }
    }
}

query ListMyCompanyContacts($companyId: UUID!) @auth(level: USER) {
    company(key: { id: $companyId })
        @redact
        @check(
            expr: "this != null && this.teamId == auth.token.teamId"
            message: "You do not have access to this company"
        ) {
        id
        teamId
    }
    companyContacts(
        where: { companyId: { eq: $companyId } }
        orderBy: [{ createdAt: ASC }]
    ) {
        id
        companyId
        name
        email
        phoneNumber
        role
        createdAt
        updatedAt
    }
}
