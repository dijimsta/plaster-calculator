query ListQuestionnaireTemplates @auth(level: USER) {
    questionnaireTemplates(
        where: { teamId: { eq_expr: "auth.token.teamId" } }
        orderBy: [{ updatedAt: DESC }]
    ) {
        id
        name
        createdAt
        updatedAt
    }
}

query GetQuestionnaireTemplate($id: UUID!) @auth(level: USER) {
    questionnaireTemplate(key: { id: $id })
        @check(
            expr: "this != null && this.teamId == auth.token.teamId"
            message: "You do not have access to this template"
        ) {
        id
        teamId
        name
        createdAt
        updatedAt
        questions: questionnaireTemplateQuestions_on_template(
            orderBy: [{ position: ASC }]
        ) {
            id
            label
            position
        }
    }
}

query ListProjectQuestionnaires @auth(level: USER) {
    projectQuestionnaires(
        where: { project: { teamId: { eq_expr: "auth.token.teamId" } } }
        orderBy: [{ updatedAt: DESC }]
    ) {
        projectId
        updatedAt
        project {
            name
        }
        questions: projectQuestionnaireQuestions_on_projectQuestionnaire(
            orderBy: [{ position: ASC }]
        ) {
            id
            answer
        }
    }
}

query GetProjectQuestionnaire($projectId: UUID!) @auth(level: USER) {
    project(key: { id: $projectId })
        @redact
        @check(
            expr: "this != null && this.teamId == auth.token.teamId"
            message: "You do not have access to this project"
        ) {
        id
        teamId
    }
    projectQuestionnaire(key: { projectId: $projectId }) {
        projectId
        sourceTemplateId
        createdAt
        updatedAt
        questions: projectQuestionnaireQuestions_on_projectQuestionnaire(
            orderBy: [{ position: ASC }]
        ) {
            id
            label
            position
            answer
            answerSource
        }
    }
}
