    $question17Position: Int = 0
    $includeQuestion18: Boolean = false
    $question18Label: String = ""
    $question18Position: Int = 0
    $includeQuestion19: Boolean = false
    $question19Label: String = ""
    $question19Position: Int = 0
    $includeQuestion20: Boolean = false
    $question20Label: String = ""
    $question20Position: Int = 0
) @auth(level: USER) @transaction {
    query @redact {
        project(key: { id: $projectId })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this project"
            ) {
            id
            teamId
        }
        questionnaireTemplate(key: { id: $sourceTemplateId })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this template"
            ) {
            id
            teamId
        }
    }
    projectQuestionnaire_upsert(
        data: {
            projectId: $projectId
            sourceTemplateId: $sourceTemplateId
            updatedAt_expr: "request.time"
        }
    )
    question1: projectQuestionnaireQuestion_insert(
        data: {
