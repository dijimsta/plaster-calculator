mutation DeleteQuestionnaireTemplate($id: UUID!)
@auth(level: USER)
@transaction {
    query @redact {
        questionnaireTemplate(key: { id: $id })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this template"
            ) {
            id
            teamId
        }
    }
    questionnaireTemplateQuestion_deleteMany(where: { templateId: { eq: $id } })
    questionnaireTemplate_delete(id: $id)
        @check(expr: "this != null", message: "Template not found")
}

mutation EnsureProjectQuestionnaire($projectId: UUID!)
@auth(level: USER)
@transaction {
    query @redact {
        project(key: { id: $projectId })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this project"
            ) {
            id
            teamId
        }
    }
    projectQuestionnaire_upsert(
        data: { projectId: $projectId, updatedAt_expr: "request.time" }
    )
}

mutation ApplyQuestionnaireTemplateToProject(
    $projectId: UUID!
    $sourceTemplateId: UUID!
) @auth(level: USER) @transaction {
    query @redact {
        project(key: { id: $projectId })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this project"
            ) {
            id
            teamId
        }
        questionnaireTemplate(key: { id: $sourceTemplateId })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this template"
            ) {
            id
            teamId
        }
    }
    projectQuestionnaire_upsert(
        data: {
            projectId: $projectId
            sourceTemplateId: $sourceTemplateId
            updatedAt_expr: "request.time"
        }
    )
}

# Upserts the `ProjectQuestionnaire` (recording `sourceTemplateId`) and
# inserts up to 20 copied `ProjectQuestionnaireQuestion` rows in a single
# `@transaction` mutation, so applying a template to a project — currently
# one `CreateProjectQuestionnaireQuestion` call per question via
# `Promise.all` in `useApplyQuestionnaireTemplateCallback` — becomes one
# round trip. This mutation only writes the copy: the caller reads the
# template client-side and passes the copied labels/positions in; no
# template-reading logic lives here. `ApplyQuestionnaireTemplateToProject`
# above is unchanged and keeps serving the scope-of-work route until a
# future migration moves it over to this mutation too.
#
# Shape follows `CreateQuoteWithItems` in quotes.mutations.gql: a fixed
# number of aliased `projectQuestionnaireQuestion_insert` slots, each
# switched on with `@include`, because `firebase dataconnect:sdk:generate`
# rejects any variable of an auto-generated `<Table>_Data` type (list or
# singular) with "_Data input types are not yet supported by the generated
# SDKs" — so there is no way to accept a variable-length list of questions
# in one atomic document; a fixed slot count is the only mechanism proven
# to compile and generate a working SDK. `id` is omitted from each insert
# and left to `ProjectQuestionnaireQuestion.id`'s `@default(expr:
# "uuidV4()")`, since the caller only supplies labels and positions.
#
# 20 slots comfortably covers any realistic clarification template (the
# motivating case is an eight-question template). Every per-slot variable
# has a default, so a caller only supplies values (and
# `$includeQuestionN: true`) for the slots it actually uses.
mutation BatchApplyQuestionnaireTemplateToProject(
    $projectId: UUID!
    $sourceTemplateId: UUID!
    $includeQuestion1: Boolean = false
    $question1Label: String = ""
    $question1Position: Int = 0
    $includeQuestion2: Boolean = false
    $question2Label: String = ""
    $question2Position: Int = 0
    $includeQuestion3: Boolean = false
    $question3Label: String = ""
    $question3Position: Int = 0
    $includeQuestion4: Boolean = false
    $question4Label: String = ""
    $question4Position: Int = 0
    $includeQuestion5: Boolean = false
    $question5Label: String = ""
    $question5Position: Int = 0
    $includeQuestion6: Boolean = false
    $question6Label: String = ""
    $question6Position: Int = 0
    $includeQuestion7: Boolean = false
    $question7Label: String = ""
    $question7Position: Int = 0
    $includeQuestion8: Boolean = false
    $question8Label: String = ""
    $question8Position: Int = 0
    $includeQuestion9: Boolean = false
    $question9Label: String = ""
    $question9Position: Int = 0
