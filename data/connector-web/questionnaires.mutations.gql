mutation CreateProjectQuestionnaireQuestion(
    $id: UUID!
    $projectId: UUID!
    $label: String!
    $position: Int!
) @auth(level: USER) @transaction {
    query @redact {
        project(key: { id: $projectId })
            @check(
                expr: "this != null && this.teamId == auth.token.teamId"
                message: "You do not have access to this project"
            ) {
            id
            teamId
        }
    }
    projectQuestionnaireQuestion_insert(
        data: {
            id: $id
            projectQuestionnaireId: $projectId
            label: $label
            position: $position
            createdAt_expr: "request.time"
            updatedAt_expr: "request.time"
        }
    )
}

