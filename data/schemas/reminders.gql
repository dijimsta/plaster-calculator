type Reminder
    @table
    @index(fields: ["teamId", "status", "dueAt"], order: [ASC, ASC, ASC])
    @index(fields: ["projectId", "status", "dueAt"], order: [ASC, ASC, ASC]) {
    id: UUID! @default(expr: "uuidV4()")
    team: Team! @ref(fields: "teamId", references: "id")
    teamId: String!
    project: Project! @ref(fields: "projectId", references: "id")
    projectId: UUID!
    company: Company @ref(fields: "companyId", references: "id")
    companyId: UUID
    # RETIRED: Legacy Accounts relationship. Retained for a future cleanup PR;
    # application code must not read or write this field.
    account: Account @ref(fields: "accountId", references: "id")
    accountId: UUID
    assignee: String
    name: String!
    status: String!
    dueAt: Timestamp!
    completedAt: Timestamp
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}
