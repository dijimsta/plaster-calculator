type Project
    @table
    @index(
        fields: ["teamId", "salesStatus", "updatedAt"]
        order: [ASC, ASC, DESC]
    )
    @index(fields: ["companyId", "updatedAt"], order: [ASC, DESC]) {
    id: UUID! @default(expr: "uuidV4()")
    team: Team! @ref(fields: "teamId", references: "id")
    teamId: String!
    assignee: String
    company: Company @ref(fields: "companyId", references: "id")
    companyId: UUID
    # RETIRED: Legacy Accounts relationship. Retained for a future cleanup PR;
    # application code must not read or write this field.
    account: Account @ref(fields: "accountId", references: "id")
    accountId: UUID
    name: String!
    address: String
    originalFileName: String!
    uploadType: String!
    originalPath: String!
    status: String!
    salesStatus: String! @default(value: "QUOTING")
    scope: String
    processingError: String
    pageCount: Int!
    extractedTextJson: String
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

type FloorplanPage
    @table
    @index(fields: ["projectId", "pageNumber"], order: [ASC, ASC]) {
    id: UUID! @default(expr: "uuidV4()")
    project: Project! @ref(fields: "projectId", references: "id")
    projectId: UUID!
    pageNumber: Int!
    status: String!
    processingError: String
    sourceImagePath: String
    previewImagePath: String
    rawJsonPath: String
    rawFloorplanPath: String
    overlayJson: String
    scaleMmPerPx: Float
    ceilingHeightMm: Float
    referencePointsJson: String
    referenceLengthMm: Float
    processingStrategy: String
    processingMetadataJson: String
    ocrTextContent: String
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}
