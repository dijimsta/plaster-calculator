type QuantitySource @table {
    id: UUID! @default(expr: "uuidV4()")
    measurementSource: String!
    measurementPlasterType: String
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

type QuoteItemTemplate @table {
    id: UUID! @default(expr: "uuidV4()")
    team: Team @ref(fields: "teamId", references: "id")
    # System templates are global; user-created templates belong to a team.
    teamId: String
    scope: String!
    systemKey: String @unique
    name: String!
    # Nullable so pre-unit custom templates remain identifiable and can be
    # completed explicitly by their team instead of receiving a guessed unit.
    unit: String
    hasKeywords: Boolean! @default(value: false)
    keywords: [String!]!
    quantitySource: QuantitySource
        @ref(fields: "quantitySourceId", references: "id")
    quantitySourceId: UUID
    sortOrder: Int! @default(value: 0)
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

type QuoteTemplate @table {
    id: UUID! @default(expr: "uuidV4()")
    team: Team! @ref(fields: "teamId", references: "id")
    teamId: String!
    name: String!
    isDefault: Boolean! @default(value: false)
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

type QuoteItemTemplateConfig
    @table(key: ["quoteTemplateId", "itemTemplateId"]) {
    quoteTemplate: QuoteTemplate!
        @ref(fields: "quoteTemplateId", references: "id")
    quoteTemplateId: UUID!
    itemTemplate: QuoteItemTemplate!
        @ref(fields: "itemTemplateId", references: "id")
    itemTemplateId: UUID!
    enabled: Boolean! @default(value: true)
    unitPriceCents: Int!
    materialUnitPriceCents: Int!
    labourUnitPriceCents: Int!
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

type Supplier
    @table
    @index(fields: ["teamId", "updatedAt"], order: [ASC, DESC]) {
    id: UUID! @default(expr: "uuidV4()")
    team: Team! @ref(fields: "teamId", references: "id")
    teamId: String!
    name: String!
    isDefault: Boolean! @default(value: false)

    # Contact details. Nullable with no defaults, rather than "" defaults:
    # "not filled in yet" must stay distinguishable from "deliberately
    # blank".
    contactName: String
    phoneNumber: String
    email: String
    address: String
    accountNumber: String

    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

type Quote
    @table
    @index(fields: ["teamId", "updatedAt"], order: [ASC, DESC])
    @index(fields: ["teamId", "createdAt"], order: [ASC, DESC])
    @unique(fields: ["teamId", "reference"]) {
    id: UUID! @default(expr: "uuidV4()")
    team: Team! @ref(fields: "teamId", references: "id")
    teamId: String!
    project: Project! @unique @ref(fields: "projectId", references: "id")
    projectId: UUID!
    supplier: Supplier @ref(fields: "supplierId", references: "id")
    supplierId: UUID
    status: String! @default(value: "draft")
    reference: String
    issuedAt: Timestamp
    sentAt: Timestamp
    acceptedAt: Timestamp
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

type QuoteItem @table {
    id: UUID! @default(expr: "uuidV4()")
    team: Team! @ref(fields: "teamId", references: "id")
    teamId: String!
    quote: Quote! @ref(fields: "quoteId", references: "id")
    quoteId: UUID!
    sourceTemplate: QuoteItemTemplate
        @ref(fields: "sourceTemplateId", references: "id")
    sourceTemplateId: UUID
    displayOrder: Int!
    name: String!
    quantity: Float!
    # Generated quotes are snapshots. Nullable preserves historical items
    # created before units were stored.
    unit: String
    quantitySource: QuantitySource
        @ref(fields: "quantitySourceId", references: "id")
    quantitySourceId: UUID
    unitPriceCents: Int!
    materialUnitPriceCents: Int!
    labourUnitPriceCents: Int!
    matchedKeywords: [String!]!
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

type SupplierQuoteItemPrice @table(key: ["supplierId", "templateId"]) {
    team: Team! @ref(fields: "teamId", references: "id")
    teamId: String!
    supplier: Supplier! @ref(fields: "supplierId", references: "id")
    supplierId: UUID!
    template: QuoteItemTemplate! @ref(fields: "templateId", references: "id")
    templateId: UUID!
    materialUnitPriceCents: Int!
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

# Team-scoped appearance settings for generated quote documents: letterhead,
# output detail, and terms. One row per team, following the same
# one-row-per-owner pattern as UserSettings/UserSignature, keyed on team
# instead of user. Nothing here is snapshotted onto Quote — appearance is
# presentation, read live when a document renders, so reprinting an old
# quote picks up the team's current branding. This is intended.
type QuoteAppearance @table(key: "teamId") {
    team: Team! @unique @ref(fields: "teamId", references: "id")
    teamId: String!

    # Letterhead. Nullable with no defaults, rather than "" defaults: "not
    # filled in yet" must stay distinguishable from "deliberately blank" so
    # the document can omit a line instead of printing an empty one.
    # Firebase Storage path (as used by ProjectsService.uploadProject), not
    # a download URL, since URLs expire.
    logoStoragePath: String
    businessName: String
    abn: String
    licenceNumber: String
    address: String
    phoneNumber: String
    email: String
    accentColor: String

    # Output. Non-null with defaults so a team that never opens the
    # settings tab still gets a coherent document. pricingDetail will
    # reference a closed vocabulary once it lands in
    # plaster-calculator-common.
    pricingDetail: String! @default(value: "FULL_LINE_ITEMS")
    showScopeOfWork: Boolean! @default(value: true)
    showTakeoffSummary: Boolean! @default(value: false)
    showSignatureBlock: Boolean! @default(value: false)

    # Terms
    validForDays: Int! @default(value: 30)
    terms: String

    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}
