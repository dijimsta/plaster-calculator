type Company
    @table
    @index(fields: ["teamId", "updatedAt"], order: [ASC, DESC]) {
    id: UUID! @default(expr: "uuidV4()")
    team: Team! @ref(fields: "teamId", references: "id")
    teamId: String!
    companyName: String!
    businessNumber: String
    phoneNumber: String
    primaryContact: CompanyContact
        @ref(fields: "primaryContactId", references: "id")
    primaryContactId: UUID
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

type CompanyContact
    @table
    @index(fields: ["companyId", "createdAt"], order: [ASC, ASC]) {
    id: UUID! @default(expr: "uuidV4()")
    company: Company! @ref(fields: "companyId", references: "id")
    companyId: UUID!
    name: String!
    email: String
    phoneNumber: String
    role: String
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}
