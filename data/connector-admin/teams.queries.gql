query GetTeamMembershipForUser($userId: String!) @auth(level: NO_ACCESS) {
    teamMembers(where: { userId: { eq: $userId } }) {
        teamId
        userId
        role
        team {
            id
            name
        }
    }
}

query GetTeamMember($teamId: String!, $userId: String!)
@auth(level: NO_ACCESS) {
    teamMember(key: { teamId: $teamId, userId: $userId }) {
        teamId
        userId
        role
    }
}

query ListTeamMembers($teamId: String!, $limit: Int, $offset: Int)
@auth(level: NO_ACCESS) {
    teamMembers(
        where: { teamId: { eq: $teamId } }
        orderBy: [{ createdAt: ASC }]
        limit: $limit
        offset: $offset
    ) {
        teamId
        userId
        role
    }
}

query ListPendingTeamInvitations(
    $teamId: String!
    $now: Timestamp!
    $limit: Int
    $offset: Int
) @auth(level: NO_ACCESS) {
    teamInvitations(
        where: {
            teamId: { eq: $teamId }
            acceptedAt: { isNull: true }
            expiresAt: { gt: $now }
        }
        orderBy: [{ createdAt: DESC }]
        limit: $limit
        offset: $offset
    ) {
        teamId
        email
        invitedByUserId
        expiresAt
        createdAt
        updatedAt
    }
}

query FindPendingTeamInvitationsForEmail($email: String!, $now: Timestamp!)
@auth(level: NO_ACCESS) {
    teamInvitations(
        where: {
            email: { eq: $email }
            acceptedAt: { isNull: true }
            expiresAt: { gt: $now }
        }
    ) {
        teamId
        email
        expiresAt
    }
}

query GetTeamInvitationByTokenHash($tokenHash: String!)
@auth(level: NO_ACCESS) {
    teamInvitation(first: { where: { tokenHash: { eq: $tokenHash } } }) {
        teamId
        email
        tokenHash
        invitedByUserId
        expiresAt
        acceptedAt
        acceptedByUserId
        createdAt
        updatedAt
    }
}
