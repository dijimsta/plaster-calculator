mutation CreateTeam($id: String!, $name: String!, $createdByUserId: String!)
@auth(level: NO_ACCESS) {
    team_insert(
        data: {
            id: $id
            name: $name
            createdByUserId: $createdByUserId
            createdAt_expr: "request.time"
            updatedAt_expr: "request.time"
        }
    )
}

mutation CreateTeamMember($teamId: String!, $userId: String!, $role: String!)
@auth(level: NO_ACCESS) {
    teamMember_insert(
        data: {
            teamId: $teamId
            userId: $userId
            role: $role
            createdAt_expr: "request.time"
            updatedAt_expr: "request.time"
        }
    )
}
