query ListProjectsByTeamAndSalesStatus(
    $teamId: String!
    $salesStatus: String!
    $limit: Int
    $offset: Int
) @auth(level: NO_ACCESS) {
    projects(
        where: { teamId: { eq: $teamId }, salesStatus: { eq: $salesStatus } }
        orderBy: [{ updatedAt: DESC }]
        limit: $limit
        offset: $offset
    ) {
        id
        teamId
        assignee
        companyId
        name
        address
        originalFileName
        uploadType
        originalPath
        status
        salesStatus
        processingError
        pageCount
        createdAt
        updatedAt
    }
}

