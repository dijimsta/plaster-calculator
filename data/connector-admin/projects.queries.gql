query GetProjectDetailsById($id: UUID!) @auth(level: NO_ACCESS) {
    project(id: $id) {
        id
        teamId
        assignee
        companyId
        name
        address
        originalFileName
        uploadType
        originalPath
        status
        salesStatus
        scope
        processingError
        pageCount
        extractedTextJson
        createdAt
        updatedAt
        pages: floorplanPages_on_project(orderBy: [{ pageNumber: ASC }]) {
            id
            projectId
            pageNumber
            status
            processingError
            sourceImagePath
            previewImagePath
            rawJsonPath
            rawFloorplanPath
            overlayJson
            scaleMmPerPx
            ceilingHeightMm
            referencePointsJson
            referenceLengthMm
            processingStrategy
            processingMetadataJson
            ocrTextContent
            createdAt
            updatedAt
        }
    }
}

