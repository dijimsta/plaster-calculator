query ListLegacyTeamOwnedResources @auth(level: NO_ACCESS) {
    projects {
        id
        ownerId
    }
    accounts {
        id
        ownerId
    }
    questionnaireTemplates {
        id
        ownerId
    }
    reminders {
        id
        ownerId
    }
    quoteItemTemplates {
        id
        ownerId
        scope
    }
    quoteItemTemplateConfigs {
        ownerId
        templateId
    }
    suppliers {
        id
        ownerId
    }
    quotes {
        id
        ownerId
    }
    quoteItems {
        id
        ownerId
    }
    supplierQuoteItemPrices {
        supplierId
        templateId
        ownerId
    }
}
