mutation CreateReminder(
    $id: UUID!
    $teamId: String!
    $projectId: UUID!
    $companyId: UUID
    $assignee: String
    $name: String!
    $status: String!
    $dueAt: Timestamp!
) @auth(level: NO_ACCESS) {
    reminder_insert(
        data: {
            id: $id
            teamId: $teamId
            projectId: $projectId
            companyId: $companyId
            assignee: $assignee
            name: $name
            status: $status
            dueAt: $dueAt
            createdAt_expr: "request.time"
            updatedAt_expr: "request.time"
        }
    )
}

mutation UpdateReminder(
    $id: UUID!
    $companyId: UUID
    $assignee: String
    $name: String
    $status: String
    $dueAt: Timestamp
    $completedAt: Timestamp
) @auth(level: NO_ACCESS) {
    reminder_update(
        id: $id
        data: {
            companyId: $companyId
            assignee: $assignee
            name: $name
            status: $status
            dueAt: $dueAt
            completedAt: $completedAt
            updatedAt_expr: "request.time"
        }
    )
}
