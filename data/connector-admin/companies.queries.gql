query GetCompanyById($id: UUID!) @auth(level: NO_ACCESS) {
    company(id: $id) {
        id
        teamId
        companyName
        businessNumber
        phoneNumber
        primaryContactId
        createdAt
        updatedAt
        contacts: companyContacts_on_company(orderBy: [{ createdAt: ASC }]) {
            id
            companyId
            name
            email
            phoneNumber
            role
            createdAt
            updatedAt
        }
    }
}

query GetCompanyContactById($companyId: UUID!, $contactId: UUID!)
@auth(level: NO_ACCESS) {
    companyContact(
        first: {
            where: { id: { eq: $contactId }, companyId: { eq: $companyId } }
        }
    ) {
        id
        companyId
        name
        email
        phoneNumber
        role
        createdAt
        updatedAt
    }
}
